<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eco News — Matéria</title>
<meta name="description" content="Eco News — notícias, contexto e informações sobre resíduos, reciclagem e sustentabilidade.">
<link rel="stylesheet" href="styles.css">
</head>
<body class="news-page article-page">
<header class="news-header">
  <div class="wrap nav">
    <a href="index.html" class="logo"><img src="assets/ecomix-header.png" alt="EcoMix Gestão Ambiental"></a>
    <nav class="desktop-nav">
      <a href="index.html#sobre">A EcoMix</a>
      <a href="index.html#servicos">Serviços</a>
      <a href="index.html#condominios">Condomínios</a>
      <a href="index.html#empresas">Empresas</a>
      <a href="index.html#processo">Como funciona</a>
      <a href="ecomix-news.html" class="news-nav">Eco News</a>
      <a href="index.html#contato" class="nav-cta">Fale conosco</a>
    </nav>
  </div>
</header>

<div class="article-newsbar">
  <div class="wrap">
    <a href="ecomix-news.html" class="article-newsback">← Voltar para o Eco News</a>
    <div class="article-newsbrand"><span>ECO</span><b>NEWS</b></div>
    <span class="article-newstagline">INFORMAÇÃO QUE MOVIMENTA O CICLO</span>
  </div>
</div>

<main id="articleRoot">
  <div class="news-loading">Abrindo matéria…</div>
</main>

<script>
(function(){
  const root=document.getElementById('articleRoot');
  const id=new URLSearchParams(location.search).get('id')||'';

  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));

  const date=s=>{
    try{
      return new Intl.DateTimeFormat('pt-BR',{
        day:'2-digit',month:'long',year:'numeric'
      }).format(new Date(s));
    }catch(e){return '';}
  };

  const fallbackImage='assets/hero-rapaz-reciclagem.jpg';

  function render(a){
    const image=a.image||fallbackImage;
    root.innerHTML=`
      <section class="article-hero">
        <div class="wrap article-hero-grid">
          <div class="article-hero-copy">
            <span class="article-news-eyebrow">ECO NEWS · ${esc(a.category||'SUSTENTABILIDADE')}</span>
            <h1>${esc(a.title)}</h1>
            <p>${esc(a.description||'Confira os principais pontos desta notícia e o contexto disponível na publicação original.')}</p>
            <div class="article-meta">${esc(a.source)}<br>${esc(date(a.date))}</div>
          </div>

          <figure class="article-hero-media">
            <img
              src="${esc(image)}"
              alt="${esc(a.title)}"
              loading="eager"
              referrerpolicy="no-referrer"
              onerror="this.onerror=null;this.src='${fallbackImage}'"
            >
            <figcaption>${esc(a.imageCredit||('Imagem: '+a.source))}</figcaption>
          </figure>
        </div>
      </section>

      <article class="article-content">
        <div class="wrap article-layout">
          <div class="article-main">
            <div class="article-intro">
              Esta matéria foi selecionada pelo <strong>Eco News</strong> a partir de uma publicação original. 
              Organizamos o resumo e o contexto disponível na fonte, sem substituir a reportagem de origem.
            </div>

            <section>
              <h2>O que a notícia mostra</h2>
              <p>${esc(a.description||'A publicação original apresenta informações sobre o tema, seus impactos e os principais envolvidos.')}</p>
            </section>

            ${(a.points||[]).map(p=>`
              <section>
                <h2>${esc(p.title)}</h2>
                <p>${esc(p.text)}</p>
              </section>
            `).join('')}

            <div class="article-source">
              <span>PUBLICAÇÃO ORIGINAL</span>
              <strong>${esc(a.source)}</strong>
              <p>O conteúdo, a reportagem e as imagens pertencem à publicação original. Consulte a fonte para a matéria completa e eventuais atualizações.</p>
              <a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">Ler a matéria original ↗</a>
            </div>
          </div>

          <aside class="article-aside">
            <div>
              <span>ECO NEWS</span>
              <strong>Informação que movimenta o ciclo.</strong>
            </div>
            <a href="ecomix-news.html">Ver outras matérias →</a>
            <a href="index.html">Voltar para a EcoMix →</a>
          </aside>
        </div>
      </article>
    `;
  }

  fetch('/api/news?id='+encodeURIComponent(id),{cache:'no-store'})
    .then(r=>r.json())
    .then(a=>{
      if(!a||a.error) throw new Error('notícia');
      render(a);
    })
    .catch(()=>{
      root.innerHTML=`
        <section class="article-content">
          <div class="wrap">
            <div class="article-intro">Não foi possível carregar esta matéria agora.</div>
            <a class="article-back" href="ecomix-news.html">← Voltar ao Eco News</a>
          </div>
        </section>`;
    });
})();
</script>
</body>
</html>
