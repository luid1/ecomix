<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1360px;height:900px;overflow:hidden;background:#073F32}
  .scene{position:relative;width:1360px;height:900px;overflow:hidden}
  .bg{position:absolute;inset:-30px;background:url('assets/hero-bg.jpg') center/cover no-repeat;
      filter:blur(4px) brightness(.92) saturate(1.1);}
  .tint{position:absolute;inset:0;
      background:linear-gradient(115deg, rgba(7,63,50,.42), rgba(7,63,50,.08) 45%, rgba(7,63,50,.4));}
  .vign{position:absolute;inset:0;box-shadow:inset 0 0 200px 50px rgba(5,30,24,.5);}
  .stage{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;
      gap:20px;padding-bottom:58px;perspective:2600px;}
  .unit{position:relative;}
  .b3d{position:relative;width:352px;height:552px;transform-style:preserve-3d;
      transform:rotateX(-2deg) rotateY(-4deg);}
  .caption{position:absolute;top:58px;left:0;right:0;z-index:6;text-align:center;padding:0 60px;
      text-shadow:0 2px 18px rgba(4,25,19,.6);}
  .caption .eyebrow{display:inline-flex;align-items:center;gap:11px;color:#9FE06B;
      font:800 15px/1 'Lato',Arial;letter-spacing:3.4px;text-transform:uppercase;margin-bottom:12px;}
  .caption .sp{display:inline-flex;height:7px;width:40px;border-radius:3px;overflow:hidden}
  .caption .sp i{flex:1}
  .caption h2{color:#fff;font:900 42px/1.02 'Lato',Arial;letter-spacing:-1.2px;margin:0;}
  .f{position:absolute;overflow:hidden;border-radius:8px;background:#073F32;
     box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);}
  .f img{width:100%;height:100%;object-fit:cover;display:block}
  .front{width:352px;height:552px;transform:translateZ(176px)}
  .right{width:352px;height:552px;transform:rotateY(90deg) translateZ(176px)}
  .left{width:352px;height:552px;transform:rotateY(-90deg) translateZ(176px)}
  .top{width:352px;height:352px;top:100px;transform:rotateX(90deg) translateZ(276px);
     background:linear-gradient(135deg,#0E6049,#073F32);border-radius:8px;
     display:flex;align-items:center;justify-content:center;}
  .top span{color:rgba(255,255,255,.7);font:800 20px Arial;letter-spacing:1px}
  .shadow{position:absolute;left:50%;bottom:-24px;width:360px;height:52px;transform:translateX(-50%);
     background:radial-gradient(ellipse at center, rgba(0,0,0,.52), transparent 70%);filter:blur(5px);}
</style></head>
<body>
  <div class="scene">
    <div class="bg"></div><div class="tint"></div>
    <div class="caption">
      <div class="eyebrow"><span class="sp"><i style="background:#2159C4"></i><i style="background:#CF3339"></i><i style="background:#E0A81F"></i><i style="background:#2F9F4F"></i></span> Estações de coleta EcoMix</div>
      <h2>Pensadas para o seu condomínio.</h2>
    </div>
    <div class="stage">
      <div class="unit">
        <div class="b3d">
          <div class="f front"><img src="assets/caixas3d/verde/c1-front.png"></div>
          <div class="f right"><img src="assets/caixas3d/verde/c1-right.png"></div>
          <div class="f left"><img src="assets/caixas3d/verde/c1-left.png"></div>
          <div class="f top"><span>EcoMix</span></div>
        </div>
        <div class="shadow"></div>
      </div>
      <div class="unit">
        <div class="b3d">
          <div class="f front"><img src="assets/caixas3d/verde/c2-front.png"></div>
          <div class="f right"><img src="assets/caixas3d/verde/c2-right.png"></div>
          <div class="f left"><img src="assets/caixas3d/verde/c2-left.png"></div>
          <div class="f top"><span>EcoMix</span></div>
        </div>
        <div class="shadow"></div>
      </div>
    </div>
    <div class="vign"></div>
  </div>
</body></html>
